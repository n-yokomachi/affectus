[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affectus-evaluation"
version = "0.1.0"
description = "Evaluation rig for affectus (Claude Agent SDK backend; optional Bedrock)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "matplotlib>=3.8",
    "claude-agent-sdk>=0.2.134",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]
bedrock = ["strands-agents>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
